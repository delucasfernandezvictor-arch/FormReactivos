<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Nuevo Producto</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="alternarModoOscuro()">
        {{ modoOscuro() ? 'Modo claro' : 'Modo oscuro' }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="contenedor">
    <form [formGroup]="inventarioForm" (ngSubmit)="onSubmit()">
      <ion-list lines="full">

        <ion-item>
          <ion-input
            label="Código de barras (SKU)"
            labelPlacement="floating"
            type="text"
            maxlength="12"
            formControlName="sku"
            [errorText]="mensajeError('sku')">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            label="Nombre del producto"
            labelPlacement="floating"
            type="text"
            formControlName="nombre"
            [errorText]="mensajeError('nombre')">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-select
            label="Categoría"
            labelPlacement="floating"
            placeholder="Selecciona una categoría"
            formControlName="categoria"
            [errorText]="mensajeError('categoria')">
            @for (cat of categorias; track cat) {
              <ion-select-option [value]="cat">{{ cat }}</ion-select-option>
            }
          </ion-select>
        </ion-item>

        <ion-item>
          <ion-input
            label="Stock mínimo"
            labelPlacement="floating"
            type="number"
            inputmode="numeric"
            formControlName="stockMinimo"
            [errorText]="mensajeError('stockMinimo')">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            label="Fecha de nacimiento"
            labelPlacement="stacked"
            type="date"
            [max]="hoy"
            formControlName="fechaNacimiento"
            [errorText]="mensajeError('fechaNacimiento')">
          </ion-input>
        </ion-item>

        <ion-item>
          <ion-input
            label="Contraseña"
            labelPlacement="floating"
            type="password"
            formControlName="password"
            [errorText]="mensajeError('password')">
          </ion-input>
        </ion-item>

      </ion-list>

      <div class="ion-padding-top">
        <ion-button expand="block" type="submit" [disabled]="inventarioForm.invalid || isSubmitting()">
          Guardar producto
        </ion-button>
      </div>
    </form>

    <ion-button expand="block" fill="outline" type="button" [disabled]="!ultimoEnvio()" (click)="descargarPdf()">
      Descargar PDF
    </ion-button>
  </div>

  <ion-loading [isOpen]="isSubmitting()" message="Guardando producto..."></ion-loading>

  <ion-toast
    [isOpen]="mostrarToast()"
    message="Formulario enviado correctamente"
    color="success"
    [duration]="2500"
    (didDismiss)="mostrarToast.set(false)">
  </ion-toast>
</ion-content>
